name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          unzip -q "streamix-bd (6).zip" -d extracted

          echo "===== Project files ====="
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle Project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f | head -1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ gradlew not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Project found: $PROJECT_DIR"

      - name: Install Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          URL=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties \
            | cut -d'=' -f2- \
            | sed 's/\\:/:/g')

          echo "Gradle URL: $URL"

          wget -q "$URL" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

          GRADLE_DIR=$(find /tmp/gradle -maxdepth 1 -type d -name 'gradle-*' | head -1)

          if [ -z "$GRADLE_DIR" ]; then
            echo "❌ Gradle installation failed!"
            exit 1
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "✅ Gradle installed: $GRADLE_DIR"

      - name: Create Debug Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "✅ debug.keystore created"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          "$GRADLE_DIR/bin/gradle" assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK files ====="
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Bd-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
