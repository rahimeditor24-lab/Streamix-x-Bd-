name: Build Streamix BD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "${{ steps.zip.outputs.zip }}" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -150

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            echo "Searching project files:"
            find android-project -type f \
              \( -name "settings.gradle*" \
              -o -name "build.gradle*" \
              -o -name "gradlew" \)
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 9.3.1
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip

          unzip -q gradle-9.3.1-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

          export PATH="$RUNNER_TEMP/gradle-9.3.1/bin:$PATH"

          gradle --version

      - name: Remove Broken Gradle Wrapper
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "Removing broken Gradle wrapper..."

          rm -rf gradle/wrapper
          rm -f gradlew
          rm -f gradlew.bat

          echo "Wrapper removed."

      - name: Check Android Project
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle*" \
            -o -name "settings.gradle*" \
            -o -name "gradle.properties" \)

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -name "*.apk" \
            | grep -E "debug|release" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find "${{ steps.project.outputs.project_dir }}" \
              -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/Streamix-BD-debug.apk

          echo "apk=output/Streamix-BD-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-APK
          path: output/Streamix-BD-debug.apk
          if-no-files-found: error
          retention-days: 7
